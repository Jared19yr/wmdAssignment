    </header>

    <div class="companies-wrapper">
        
        <div class="alert alert-light border text-center mb-4 py-3 fw-bold text-secondary" style="border-radius: 10px;">
            EXPLORE TOP EMPLOYERS HIRING RIGHT NOW IN BOTSWANA
        </div>

        <h1 class="page-main-title">Hiring Companies</h1>

        <div class="filter-scroll-container">
            <button class="filter-pill-btn active" onclick="filterSector('all', this)">All Sectors</button>
            <button class="filter-pill-btn" onclick="filterSector('Technology', this)">Technology</button>
            <button class="filter-pill-btn" onclick="filterSector('Finance', this)">Finance & Banking</button>
            <button class="filter-pill-btn" onclick="filterSector('Marketing', this)">Marketing & Media</button>
            <button class="filter-pill-btn" onclick="filterSector('Management', this)">Management & Logistics</button>
            <button class="filter-pill-btn" onclick="filterSector('Aviation', this)">Aviation</button>
            <button class="filter-pill-btn" onclick="filterSector('Hospitality', this)">Hospitality</button>
        </div>

        <div class="inner-directory-box" id="directoryListContainer">
            </div>
    </div>

    <footer>
        <div class="container text-center">
            <div class="d-flex justify-content-center gap-4 mb-2">
                <a href="feedbackpage.html" class="text-white text-decoration-none">FEEDBACK</a>
                <span class="text-secondary">|</span>
                <a href="About.html" class="text-white text-decoration-none">About Us</a>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Central Shared Dataset Expanded to 8 Companies
        const employers = [
            {
                id: "tech-corp",
                name: "Tech Corp Botswana",
                sector: "Technology",
                description: "Leading enterprise technology solutions provider specializing in agile applications infrastructure, systems architectures development, and cloud data platforms scaling locally.",
                vacanciesCount: 3,
                image: "tech-corp.png"
            },
            {
                id: "finance-plus",
                name: "Finance Plus",
                sector: "Finance",
                description: "A premier financial analysis, investments strategies firm, and asset management partner built to scale operational growth models across corporate structures.",
                vacanciesCount: 2,
                image: "finance-plus.png"
            },
            {
                id: "btcl",
                name: "Botswana Telecom",
                sector: "Marketing",
                description: "Connecting individuals and corporations across the country with world-class standard mobile telephony network systems, internet service, and enterprise communications pipelines.",
                vacanciesCount: 2,
                image: "botswana-telecom.png"
            },
            {
                id: "logistics-co",
                name: "Construction & Logistics Co.",
                sector: "Management",
                description: "Managing full-scale structural industrial engineering build developments, transport logistics networks, and regional operations supply chains with excellence.",
                vacanciesCount: 3,
                image: "construction-logistics.png"
            },
            {
                id: "innovative-sys",
                name: "Botswana Innovative System",
                sector: "Technology",
                description: "Pioneering state-of-the-art native software engineering architectures, machine intelligence pipelines, and creative tech incubators tailored across corporate operations.",
                vacanciesCount: 2,
                image: "innovative-system.png"
            },
            {
                id: "kgale-investment",
                name: "Kgale Investment Partners",
                sector: "Finance",
                description: "Strategic investment advisors specializing in venture development funds portfolio management, wealth expansion pipelines, and secure financial asset backing options.",
                vacanciesCount: 2,
                image: "kgale-investment.png"
            },
            {
                id: "sir-seretse",
                name: "Sir Seretse Khama Airport Services",
                sector: "Aviation",
                description: "Delivering world-class aviation logistical processing models, aircraft fleet support architectures, and international transit terminal management operations efficiently.",
                vacanciesCount: 2,
                image: "airport-services.png"
            },
            {
                id: "mokolodi-safari",
                name: "Mokolodi Safari Lodges",
                sector: "Hospitality",
                description: "A premier eco-tourism wilderness destination offering luxurious wildlife accommodation spaces, professional reserve hosting assets, and cultural hospitality frameworks.",
                vacanciesCount: 1,
                image: "mokolodi-safari.png"
            }
        ];

        function renderDirectory(filter = "all") {
            const listContainer = document.getElementById('directoryListContainer');
            listContainer.innerHTML = '';

            const itemsToDisplay = filter === "all" ? employers : employers.filter(emp => emp.sector === filter);

            if (itemsToDisplay.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-muted py-5">No companies currently listing open jobs in this specific department.</div>`;
                return;
            }

            itemsToDisplay.forEach(emp => {
                listContainer.innerHTML += `
                    <a href="companies-details.html?id=${emp.id}" class="company-strip-card">
                        <div class="logo-placeholder-box" style="border: none; background: transparent;">
                            <img src="${emp.image}" alt="${emp.name} Logo" style="max-width: 100%; max-height: 100%; object-fit: contain;">
                        </div>
                        <div class="company-strip-info">
                            <h3>${emp.name}</h3>
                            <p>${emp.description}</p>
                            <span class="hiring-badge">🔥 ${emp.vacanciesCount} Live Job Vacancies</span>
                        </div>
                    </a>
                `;
            });
        }

        function filterSector(sectorName, btnElement) {
            document.querySelectorAll('.filter-pill-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderDirectory(sectorName);
        }

        window.onload = function() {
            renderDirectory('all');
        };
    </script>
</body>
</html>
