<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Career Path Connect</title>
    
    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">

                <div class="d-flex align-items-center gap-3">
                    <img src="logo.png" alt="Career Path Connect Logo" width="50" height="50">
                    <div class="site-logo">Career Path <span>Connect</span></div>
                </div>

                <nav class="navbar navbar-expand-lg">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                   <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav ms-auto gap-3">
                            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="job-vacancies.html">Job Vacancies</a></li>
                            <li class="nav-item"><a class="nav-link" href="new-job-listings.html">New Job Listings</a></li>
                            <li class="nav-item"><a class="nav-link active" href="post-jobs.html">Post Jobs</a></li>
                            <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>

                            <li class="nav-item auth-group">
                                <a class="nav-link" href="logIn.html">LogIn</a>
                            </li>
                            <li class="nav-item auth-group">
                                <a class="nav-link btn btn-warning px-4" href="Pages/register.html">Register</a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <div class="container my-5">
        <h1 class="text-center mb-3 fw-bold" style="color: #1a3c5e; font-family: 'Poppins', sans-serif;">Post a New Job</h1>
        <p class="text-center text-muted mb-5">Fill out the information below to list your opening on our portal</p>
        
        <div class="card mx-auto shadow-sm border" style="max-width: 700px; border-radius: 12px; overflow: hidden;">
            <div class="card-body p-5">
                <form>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Job Title</label>
                        <input type="text" class="form-control py-2" placeholder="e.g. Senior Software Engineer" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-dark">Company Name</label>
                        <input type="text" class="form-control py-2" placeholder="e.g. Tech Corp Botswana" required>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-dark">Location</label>
                            <input type="text" class="form-control py-2" placeholder="e.g. Gaborone" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold text-dark">Salary</label>
                            <input type="text" class="form-control py-2" placeholder="e.g. P14,000 /mo" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold text-dark">Job Description</label>
                        <textarea class="form-control" rows="6" placeholder="Provide a detailed description of roles, operational responsibilities, and application criteria..." required></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 py-2.5 rounded-pill fw-bold shadow-sm">🚀 Post Job Opening</button>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-light text-center py-4">
        <p class="mb-0">&copy; 2026 Career Path Connect. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
