<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - Career Path Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="custom-header"> 
    <header class="bg-light shadow-sm">
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">
                <div class="site-logo">Career Path <span>Connect</span></div>
                <nav class="navbar navbar-expand-lg">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav ms-auto gap-3">
                            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="job-vacancies.html">Job Vacancies</a></li>
                            <li class="nav-item"><a class="nav-link" href="new-job-listings.html">New Job Listings</a></li>
                            <li class="nav-item"><a class="nav-link active" href="#">Post Jobs</a></li>
                            <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </header>
 </header>

<div class="container my-5">
    <h1 class="text-center mb-5">Post a New Job</h1>
    <div class="card mx-auto" style="max-width: 700px;">
        <div class="card-body p-5">
            <form>
                <div class="mb-3">
                    <label>Job Title</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label>Company Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Location</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Salary</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label>Job Description</label>
                    <textarea class="form-control" rows="6"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Post Job</button>
            </form>
        </div>
    </div>
</div>

<footer class="bg-dark text-light text-center py-4">

    </footer>

</html>
