<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Path Connect</title>

    <!-- Favicon (shows on browser tab) -->
    <link rel="icon" href="../logo.png" type="image/png">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">

                <!-- Logo + Image -->
                <div class="d-flex align-items-center gap-3">
                    <img src="../logo.png" alt="Career Path Connect Logo" width="50" height="50">
                    <div class="site-logo">Career Path <span>Connect</span></div>
                </div>

                <!-- Navigation -->
                <nav class="navbar navbar-expand-lg">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                   <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav ms-auto gap-3">

                            <!-- Main Menu Navigation links -->
                            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="../job-vacancies.html">Job Vacancies</a></li>
                            <li class="nav-item"><a class="nav-link" href="../new-job-listings.html">New Job Listings</a></li>
                            <li class="nav-item"><a class="nav-link" href="../post-jobs.html">Post Jobs</a></li>
                            <li class="nav-item"><a class="nav-link" href="../companies.html">Companies</a></li>

                            <!-- Login & Register - pushed to the right using CSS -->
                            <li class="nav-item auth-group">
                                <a class="nav-link" href="../logIn.html">LogIn</a>
                            </li>
                            <li class="nav-item auth-group">
                                <a class="nav-link btn btn-warning px-4" href="../register.html">Register</a>
                            </li>
                          </ul>
                    </div>
                </nav>
            </div>
        </div>
    </header>
    <div class="container my-5">
        <div class="text-center mb-5">
            <h2>Candidate's Sign-Up</h2>
        </div>

        <div class="row justify-content-center g-4">

            <!-- Left Card - Candidate Details -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-header text-center" style="background-color: #1a3c5e; color: white;">
                        <h4>Candidate Details</h4>
                    </div>
                    <div class="card-body p-5">
                        <form>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Full Name">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="email" class="form-control" placeholder="Email Address">
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="tel" class="form-control" placeholder="Phone Number">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <select class="form-select">
                                        <option>Field of Study / Interest</option>
                                        <option>Technology</option>
                                        <option>Business Administration</option>
                                        <option>Humanities</option>
                                        <option>Healthcare</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control" rows="4" placeholder="Brief description about yourself..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-3">Create Candidate Account</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Right Side Box (Login / Additional Info) -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100" style="background-color: #e0e0e0;">
                    <div class="card-body p-4">
                        <h5 class="text-center mb-4">Already have an account?</h5>
                        <a href="../logIn.html" class="btn btn-outline-primary w-100 mb-3">Log In</a>

                        <div class="mt-5">
                            <p class="text-center text-muted small">Or continue with</p>
                            <!-- You can add social login buttons here later -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4">
        <nav>
      <a href="../FAQs.html">|   FAQs   |</a>
      <a href="../About.html">About Us   |</a>
      <a href="../Contact.html">   Contact  |</a>
    </nav>

    <br>
    <p>&copy; 2026 Career Path Connect. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
