<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Career Path Connect</title>

    <link rel="icon" href="logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="container py-3">
            <div class="d-flex justify-content-between align-items-center">

                <!-- Logo -->
                <div class="d-flex align-items-center gap-3">
                    <img src="logo.png" alt="Logo" class="site-logo-img" width="55" height="55">
                    <div class="site-logo">Career Path <span>Connect</span></div>
                </div>

                <!-- Navigation -->
                <nav class="navbar navbar-expand-lg">
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navMenu">
                        <ul class="navbar-nav ms-auto gap-3">
                            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="job-vacancies.html">Job Vacancies</a></li>
                            <li class="nav-item"><a class="nav-link" href="new-job-listings.html">New Job Listings</a></li>
                            <li class="nav-item"><a class="nav-link" href="post-jobs.html">Post Jobs</a></li>
                            <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>
                            <li class="nav-item"><a class="nav-link active" href="logIn.html">Login</a></li>
                            <li class="nav-item"><a class="nav-link btn btn-warning px-4" href="Pages/register.html">Register</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- LOGIN SECTION -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Welcome Back</h2>
                        <p class="text-center text-muted mb-4">Sign in to your account</p>

                        <form>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="Enter your email">
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter your password">
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-3">Login</button>
                        </form>

                        <div class="text-center mt-4">
                            <p>Don't have an account?
                                <a href="Pages/register.html" class="text-decoration-none">Register here</a>
                            </p>
                            <p><a href="#" class="text-decoration-none">Forgot Password?</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Career Path Connect. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
